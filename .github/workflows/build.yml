name: Build Forgotten Wilds Fabric 26.3
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'
      - name: Restore original Java sources and tools
        shell: bash
        run: |
          cat source-bundle/part*.b64 | base64 --decode > /tmp/forgottenwilds-sources.tar.xz
          echo "3dbed042ec5b63c6b6d348c28bef140908447b305fd8dcf17fbdbd673ca7226f  /tmp/forgottenwilds-sources.tar.xz" | sha256sum --check
          tar -xJf /tmp/forgottenwilds-sources.tar.xz
      - name: Restore v0.2 art and content overhaul
        run: |
          cat overlay-v0.2/part*.b64 | base64 --decode > /tmp/forgottenwilds-v0.2.tar.xz
          echo "67cbd7f20aa5bf488d5860af9b6924ed52163f0a2ca918ac7b3e80201c26563f  /tmp/forgottenwilds-v0.2.tar.xz" | sha256sum --check
          tar -xJf /tmp/forgottenwilds-v0.2.tar.xz
          sed -i 's/version=0.1.0/version=0.2.0/' gradle.properties
      - name: Adapt player notifications to Minecraft 26.3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('src/main/java')
          for path in root.rglob('*.java'):
              original=path.read_text()
              updated=re.sub(r'player\.displayClientMessage\((.*?),\s*true\);', r'player.sendSystemMessage(\1);', original)
              if original!=updated:
                  path.write_text(updated)
                  print('Updated messaging API in', path)
          PY
      - name: Generate original pixel textures and models
        run: |
          python3 -m pip install --user Pillow
          python3 tools/generate_assets.py
          python3 tools/vanilla_art_pass.py
          python3 tools/content_upgrade_v2.py
          python3 tools/art_direction_v2.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          for p in Path('src/main/resources').rglob('*.json'): json.loads(p.read_text())
          for typ in ('item','block'):
              sprites=list(Path(f'src/main/resources/assets/forgottenwilds/textures/{typ}').glob('*.png'))
              assert all(Image.open(p).size==(16,16) for p in sprites), f'Bad {typ} art size'
              print(typ,len(sprites),'textures validated')
          PY
      - name: Build actual Fabric JAR
        run: gradle --no-daemon --stacktrace clean build
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ForgottenWilds-Fabric-26.3-v0.2
          path: build/libs/forgottenwilds-0.2.0.jar
          if-no-files-found: error
